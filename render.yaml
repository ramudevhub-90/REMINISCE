services:
  - type: web
    name: reminisce
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22.19.0"
      - key: QLOO_MODE
        value: sample
      - key: QLOO_API_KEY
        sync: false
